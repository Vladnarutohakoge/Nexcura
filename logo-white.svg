<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none" role="img" aria-label="NexCura Logo (Light)">
  <defs>
    <linearGradient id="nc-white-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2b4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="nc-white-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="nc-white-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nc-white-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(6, 6)" filter="url(#nc-white-shadow)">
    <rect x="0" y="0" width="52" height="52" rx="16" fill="rgba(255,255,255,0.08)" />
    <rect x="0.5" y="0.5" width="51" height="51" rx="15.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <path d="M 26 11 C 28.2 11 30 12.8 30 15 L 30 37 C 30 39.2 28.2 41 26 41 C 23.8 41 22 39.2 22 37 L 22 15 C 22 12.8 23.8 11 26 11 Z" 
          fill="#ffffff" opacity="0.9" />

    <path d="M 13 26 C 13 23.8 14.8 22 17 22 L 35 22 C 37.2 22 39 23.8 39 26 C 39 28.2 37.2 30 35 30 L 17 30 C 14.8 30 13 28.2 13 26 Z" 
          fill="url(#nc-white-grad-primary)" />

    <path d="M 17 33 C 14 26 21 16 31 16 C 37 16 41 20 41 26 C 41 33 33 37 25 37" 
          stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

    <circle cx="26" cy="26" r="4.5" fill="#ffffff" filter="url(#nc-white-glow)" />
    <circle cx="26" cy="26" r="2.5" fill="#0b5d5e" />

    <circle cx="39" cy="15" r="2" fill="#34d399" />
    <circle cx="13" cy="37" r="1.5" fill="#38bdf8" />
  </g>

  <g transform="translate(72, 41)">
    <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="-0.8px" 
          fill="#ffffff">
      Nex
    </text>

    <text x="56" y="0" 
          font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-weight="600" 
          font-size="28" 
          letter-spacing="-0.5px" 
          fill="url(#nc-white-grad-text)">
      Cura
    </text>

    <circle cx="120" cy="-21" r="2.5" fill="#34d399" filter="url(#nc-white-glow)" />

    <text x="1" y="14" 
          font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-weight="600" 
          font-size="8.5" 
          letter-spacing="0.18em" 
          text-transform="uppercase" 
          fill="#a7f3d0">
      INTELLIGENT CARE PLATFORM
    </text>
  </g>
</svg>
