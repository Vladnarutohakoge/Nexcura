version: '3.8'

services:
  nexcura-web:
    build: .
    container_name: nexcura-healthcare
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
    volumes:
      - nexcura-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nexcura-data:
